services:
  mysql:
    image: mysql:8.4
    container_name: mysql_rentas
    environment:
      MYSQL_DATABASE: renta_herramientas_db
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      # 3307 en el equipo para no chocar con un MySQL instalado en Windows (puerto 3306).
      # Dentro de Docker la app sigue usando mysql:3306. Se puede cambiar con DB_PORT=3308.
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umysql", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  tomcat:
    build: .
    container_name: tomcat_rentas
    ports:
      # Si el 8080 ya está ocupado (p. ej. un Tomcat instalado en el sistema): APP_PORT=8081 docker compose up -d
      - "${APP_PORT:-8080}:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/renta_herramientas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=mysql
      - DB_PASSWORD=mysql
      - APP_UPLOADS_DIR=/usr/local/tomcat/uploads
      - APP_ZONA_HORARIA=America/Bogota
    volumes:
      # Las imágenes subidas se conservan aunque se reconstruya el contenedor.
      - uploads:/usr/local/tomcat/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  mysqldata:
  uploads:
