<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Renta de Herramientas y Equipos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">RentaHerramientas Pro</a>
            <div id="auth-status" class="d-flex text-white">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <!-- Sección de Autenticación (Login) -->
        <div id="login-section" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" required value="juan.cliente@gmail.com">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required value="Rentas2026*">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                        <p class="small text-muted mt-3 mb-0">
                            Admin: admin@rentas.com · Proveedor: carlos.proveedor@gmail.com · Cliente: juan.cliente@gmail.com<br>
                            Contraseña de prueba: Rentas2026*
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel Principal (Oculto hasta hacer login) -->
        <div id="dashboard-section" class="d-none">
            <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="catalogo-tab" data-bs-toggle="tab" data-bs-target="#catalogo" type="button" role="tab">Catálogo de Herramientas</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="nueva-herramienta-tab" data-bs-toggle="tab" data-bs-target="#nueva-herramienta" type="button" role="tab">Registrar Herramienta (Proveedor)</button>
                </li>
            </ul>

            <div class="tab-content" id="myTabContent">
                <!-- Pestaña Catálogo -->
                <div class="tab-pane fade show active" id="catalogo" role="tabpanel">
                    <h3>Herramientas Disponibles</h3>
                    <div class="row" id="herramientas-list">
                        <!-- Las tarjetas se cargan con JS -->
                    </div>
                </div>

                <!-- Pestaña Registrar Herramienta -->
                <div class="tab-pane fade" id="nueva-herramienta" role="tabpanel">
                    <div class="col-md-6">
                        <h3>Agregar Nueva Herramienta</h3>
                        <form id="herramienta-form">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="h-nombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" id="h-descripcion" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoría ID</label>
                                <input type="number" class="form-control" id="h-categoria" required value="1">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen (URL)</label>
                                <input type="url" class="form-control" id="h-imagen">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tarifa Diaria ($)</label>
                                <input type="number" step="0.01" class="form-control" id="h-tarifa" required>
                            </div>
                            <button type="submit" class="btn btn-success">Guardar Herramienta</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
