server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/renta_herramientas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:mysql}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET:ClaveSecretaSuperSeguraParaProyectoDeRentaDeHerramientas2026AcademicSecureKey}
  expiration-ms: 86400000

app:
  # Zona horaria del negocio: define qué día es "hoy" para reservas y vencimientos.
  zona-horaria: ${APP_ZONA_HORARIA:America/Bogota}
  uploads:
    # Carpeta donde se guardan las imágenes subidas (se publican en /uploads/**).
    dir: ${APP_UPLOADS_DIR:uploads}
  vencimiento:
    # Todos los días a las 00:05 (segundo minuto hora día mes día-semana).
    cron: ${APP_VENCIMIENTO_CRON:0 5 0 * * *}
