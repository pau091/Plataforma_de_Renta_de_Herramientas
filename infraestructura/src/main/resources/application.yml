server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/renta_herramientas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:mysql}
    password: ${DB_PASSWORD:mysql}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    # Si la base ya tiene tablas pero no historial de Flyway (creada a mano con sql/schema.sql y sql/data.sql),
    # se registra como esta versión y no se reaplican las migraciones. Actualizar al agregar migraciones nuevas.
    baseline-on-migrate: true
    baseline-version: 11

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  # Las respuestas de la API son JSON (Swagger mostraría */* si no se indica).
  default-produces-media-type: application/json
  swagger-ui:
    # Conserva el token de "Authorize" al recargar la página y ordena por ruta dentro de cada etiqueta.
    persist-authorization: true
    operations-sorter: alpha
    doc-expansion: none

jwt:
  secret: ${JWT_SECRET:ClaveSecretaSuperSeguraParaProyectoDeRentaDeHerramientas2026AcademicSecureKey}
  expiration-ms: 86400000

app:
  # Zona horaria del negocio: define qué día es "hoy" para reservas y vencimientos.
  zona-horaria: ${APP_ZONA_HORARIA:America/Bogota}
  uploads:
    # Carpeta donde se guardan las imágenes subidas (se publican en /uploads/**).
    dir: ${APP_UPLOADS_DIR:uploads}
  reservas:
    # Plazo máximo para que el proveedor acepte una reserva PENDIENTE, o para que el cliente
    # pague una reserva ACEPTADA, antes de que venza (formato ISO-8601: PT1H = 1 hora).
    plazo-maximo: ${APP_RESERVAS_PLAZO_MAXIMO:PT1H}
  vencimiento:
    # Revisión de reservas vencidas: cada minuto (segundo minuto hora día mes día-semana).
    cron: ${APP_VENCIMIENTO_CRON:0 * * * * *}
